# Déploiement du viewer de replays sur Cloudflare Pages (décision 0004).
# Désactivé tant que la variable DEPLOY_ENABLED n'est pas à true (Terraform).
# Les secrets Cloudflare n'existent que dans l'environnement « production »,
# réservé à la branche main.
name: deploy-viewer

on:
  push:
    branches: [main]
    paths:
      - "web/viewer/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-viewer
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node vient de mise (mise.toml), comme en local et dans ci.yml. Seul node est installé.
      - name: Node (mise)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.11.0
          install_args: node
          # Cache distinct de celui de ci-cpu : celui-ci ne contient que node.
          cache_key_prefix: mise-v1-deploy
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        working-directory: web/viewer
        run: |
          npm ci
          npm run build
      - name: Publication sur Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/viewer/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
