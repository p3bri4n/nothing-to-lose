# Évaluation avec les vrais modèles (Laya, LLM) sur le runner GPU auto-hébergé.
#
# Sécurité — le dépôt est public (décision 0003) :
# - JAMAIS déclenché par pull_request : du code proposé par un inconnu ne doit pas
#   s'exécuter sur la machine personnelle.
# - Seulement après un push sur main (protégée par le ruleset) ou un lancement manuel.
# - Désactivé tant que la variable GPU_EVAL_ENABLED n'est pas à true (Terraform).
name: gpu-eval

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "services/**"
      - "targets.toml"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Nombre de parties"
        default: "20"

permissions:
  contents: read

concurrency:
  group: gpu-eval
  cancel-in-progress: false

jobs:
  eval:
    if: vars.GPU_EVAL_ENABLED == 'true' && github.repository_owner == github.actor
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Évaluation
        env:
          SEEDS: ${{ inputs.seeds || '20' }}
        run: |
          [[ "$SEEDS" =~ ^[0-9]+$ ]] || { echo "seeds invalide" >&2; exit 1; }
          just eval --seeds "$SEEDS"
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: |
            reports/report.md
            runs/**/summary.json
            runs/**/violations.txt
          if-no-files-found: warn
