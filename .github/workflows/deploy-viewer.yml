# Déploiement du viewer de replays sur Cloudflare Pages (décision 0004).
# Désactivé tant que la variable DEPLOY_ENABLED n'est pas à true (Terraform).
# Les secrets Cloudflare n'existent que dans l'environnement « production »,
# réservé à la branche main.
name: deploy-viewer

on:
  push:
    branches: [main]
    paths:
      - "web/viewer/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-viewer
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/viewer/package-lock.json
      - name: Build
        working-directory: web/viewer
        run: |
          npm ci
          npm run build
      - name: Publication sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/viewer/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
